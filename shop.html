<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Tyler's Online Shop - Shop</title>
  </head>
  <body>
    <header>
      <img src="images/Onigiri Image.png" alt="Tyler's Shop Logo" />
      <nav>
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="cart.html">Cart = <span id="cart-count">0</span></a>
      </nav>
    </header>

    <main>
      <h1>Shop Our Menu</h1>

      <!-- Category filter buttons container -->
      <section id="category-filters" class="filter-container"></section>

      <!-- Product cards grid container (Must match ID in app.js) -->
      <section id="product-grid" class="product-container"></section>

      <!-- Error message element for catch block with accessibility attribute -->
      <p id="error-message" aria-live="polite"></p>
    </main>

    <!-- Link your entry point script as an ES6 module -->
    <script type="module" src="app.js"></script>
  </body>
</html>
