<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Tyler's Online Shop - Cart</title>
  </head>
  <body>
    <header>
      <img src="images/Onigiri Image.png" alt="Tyler's Shop Logo" />
      <nav>
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="cart.html">Cart = <span id="cart-count">0</span></a>
      </nav>
    </header>

    <main>
      <h1>Your Shopping Cart</h1>
      
      <!-- Container where cart items will be dynamically listed -->
      <section id="cart-items-container" class="cart-container">
        <p>Your cart is currently empty.</p>
      </section>

      <!-- Cart Summary / Total Section -->
      <section id="cart-summary" class="summary-container">
        <h2>Total: $<span id="cart-total">0.00</span></h2>
        <button id="checkout-btn" class="checkout-button">Proceed to Checkout</button>
      </section>
    </main>

    <!-- Link your cart page logic as a module -->
    <script type="module" src="cart-page.js"></script>
  </body>
</html>
